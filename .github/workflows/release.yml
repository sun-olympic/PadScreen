name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  macos:
    name: Package macOS host
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Test and build macOS app
        run: |
          swift test
          ./scripts/test-macos-app-icon.sh
          ./scripts/build-macos-app.sh

      - name: Verify and package Apple Silicon app
        run: |
          codesign --verify --deep --strict dist/PadScreen.app
          file dist/PadScreen.app/Contents/MacOS/PadScreenHost | grep -q arm64
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent \
            dist/PadScreen.app release/PadScreen-macOS-arm64.zip
          unzip -tq release/PadScreen-macOS-arm64.zip

      - name: Upload macOS package
        uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: release/PadScreen-macOS-arm64.zip
          if-no-files-found: error

  android:
    name: Package Android client
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test and build Android client
        run: |
          ./scripts/test-android-app-icon.sh
          cd android
          ./gradlew runProtocolTests assembleDebug

      - name: Collect Android package
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            release/PadScreen-Android-debug.apk

      - name: Upload Android package
        uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: release/PadScreen-Android-debug.apk
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs:
      - macos
      - android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release packages
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd release
          sha256sum PadScreen-macOS-arm64.zip PadScreen-Android-debug.apk \
            > SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/PadScreen-macOS-arm64.zip
            release/PadScreen-Android-debug.apk
            release/SHA256SUMS.txt
